name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run dlt extraction (loads bronze into DuckDB)
        run: python extract.py

      - name: Create dbt profiles.yml for CI
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          netflix_dbt:
            outputs:
              dev:
                type: duckdb
                path: ${{ github.workspace }}/netflix_etl.duckdb
                threads: 1
                schema: dbt_dev
            target: dev
          EOF

      - name: Run dbt build (models + tests)
        working-directory: ./netflix_dbt
        run: |
          dbt deps || true
          dbt build

      - name: Generate dbt docs
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        working-directory: ./netflix_dbt
        run: dbt docs generate

      - name: Upload docs as Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./netflix_dbt/target

  deploy-docs:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4